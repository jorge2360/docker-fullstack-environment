services:
  postgres:
    image: postgres:16
    container_name: postgres_db

    restart: unless-stopped

    environment:
      POSTGRES_DB: fullstack_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123

    ports:
      - "5432:5432"

    volumes:
      - ./database/data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin

    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin123

    ports:
      - "5050:80"

    volumes:
      - ./database/pgadmin:/var/lib/pgadmin

    depends_on:
      - postgres
    
  backend:
    build:
      context: ./backend

    container_name: laravel_backend

    restart: unless-stopped

    ports:
      - "8000:80"

    volumes:
      - ./backend:/var/www/html

    depends_on:
      - postgres

    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: fullstack_db
      DB_USERNAME: admin
      DB_PASSWORD: admin123
  
  frontend:
    build:
      context: ./frontend

    container_name: react_frontend

    restart: unless-stopped

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    depends_on:
      - backend